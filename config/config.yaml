# Runtime parameters — loaded by AgentRegistry, passed as Graph(config=...).
# Separate from config/agent.yaml (the static manifest).

max_retry: 3
timeout_s: 30

# Retrieval tuning — forwarded to the inner eligibility workflow by
# EligibilityScreeningGraphNode._parent_config() under
# config["configurable"]["retrieval"]; RetrieveNode / RerankFilterNode read
# score_threshold / kb_path / abstain_min_chars from there (fallback: module
# defaults mirroring these values). The pipeline is deterministic keyword
# matching — these keys tune it; none are consumed by a live retrieval /
# vector-store call.
retrieval:
  score_threshold: 0.75
  kb_path: "config/kb/clinical_trials_kb.json"
  abstain_min_chars: 25

# Reserved for the documented LLM-synthesis upgrade (not consumed by any
# node in the deterministic pipeline). Forwarded verbatim under
# config["configurable"]["llm"].
llm:
  temperature: 0.0
  max_tokens: 1500
